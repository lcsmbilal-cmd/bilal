<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD44" />
      <stop offset="50%" stop-color="#F5B800" />
      <stop offset="100%" stop-color="#D99B00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Deep Obsidian Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="15" ry="15" fill="#171717" stroke="#2D2D2D" stroke-width="1.5" />

  <!-- Speed Lightning Bolt / Fast Express Mark -->
  <path d="M35 7 L12 36 L31 36 L27 57 L52 28 L32 28 L35 7 Z" 
        fill="url(#goldGrad)" 
        stroke="#E6A600" 
        stroke-width="1" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Inner Spark Highlight -->
  <path d="M34 11 L18 34 L30 34 L27 50 L46 29 L32 29 Z" 
        fill="#FFE875" 
        opacity="0.25" />

  <!-- Official Pakistan Green Trust Verification Dot -->
  <circle cx="52" cy="12" r="5.5" fill="#16803D" stroke="#FFFFFF" stroke-width="2" />
</svg>
